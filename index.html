<title>Обратная связь AFS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a school-office tool. Sticky header with tabs; "Send" is a two-pane
   roster + composer, "Panel" is summary-first (coverage tiles, then class and
   teacher tables, then who needs attention). Burger layers echo the paper algorithm. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EDF0F4; --line:#D8DEE6;
  --fg:#1B2433; --muted:#5D6A7C;
  --navy:#1F3A5F; --navy-fg:#FFFFFF;
  --bun:#C76A12; --bun-bg:#FCEFE0; --fill:#2E7D4F; --fill-bg:#E5F2EA;
  --ok:#2E7D4F; --ok-bg:#E3F2E8; --warn:#A86A00; --warn-bg:#FBF0D9; --bad:#B3322B; --bad-bg:#FBE7E5;
  --focus:#3B6FD8;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171F; --surface:#1A212C; --sunk:#151B24; --line:#2C3644;
  --fg:#E6EAF0; --muted:#97A3B4;
  --navy:#8FB0DD; --navy-fg:#0E1520;
  --bun:#E79A4F; --bun-bg:#2E2216; --fill:#5DBB85; --fill-bg:#16281E;
  --ok:#5DBB85; --ok-bg:#16281E; --warn:#E2B04A; --warn-bg:#2C2414; --bad:#EF7B72; --bad-bg:#311A19;
  --focus:#7FA6F0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12171F; --surface:#1A212C; --sunk:#151B24; --line:#2C3644;
  --fg:#E6EAF0; --muted:#97A3B4;
  --navy:#8FB0DD; --navy-fg:#0E1520;
  --bun:#E79A4F; --bun-bg:#2E2216; --fill:#5DBB85; --fill-bg:#16281E;
  --ok:#5DBB85; --ok-bg:#16281E; --warn:#E2B04A; --warn-bg:#2C2414; --bad:#EF7B72; --bad-bg:#311A19;
  --focus:#7FA6F0; color-scheme:dark }
*{box-sizing:border-box}
/* Скрытые вкладки не должны отображаться, даже если у них display:grid */
[hidden]{display:none !important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand b{font:700 17px/1.1 var(--f-display);letter-spacing:.2px;color:var(--navy)}
.brand span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;width:100%;min-height:64px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{padding-block:18px 40px}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.note{color:var(--muted);font-size:13px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
h2{font:700 15px/1.2 var(--f-display);letter-spacing:.2px;margin:0 0 10px;color:var(--navy);text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* send view */
.send{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
@media (max-width:820px){.send{grid-template-columns:1fr}}
.classbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:600 13px var(--f-body);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}
.srow[aria-current="true"]{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy)}
.srow .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.srow .p{font-size:12.5px;color:var(--muted);grid-column:1}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;align-self:start}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.compose{display:flex;flex-direction:column;gap:12px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.chead .t{font:700 18px/1.2 var(--f-display);color:var(--fg)}
.chead .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.layer{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.layer .lt{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.layer.bun{background:var(--bun-bg)} .layer.bun .lt{color:var(--bun)}
.layer.top{border-radius:28px 28px 10px 10px;padding-top:12px}
.layer.bot{border-radius:10px 10px 22px 22px;padding-bottom:12px}
.layer.fill{background:var(--fill-bg)} .layer.fill .lt{color:var(--fill)}
.preview{background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:14px;min-height:60px;overflow-wrap:anywhere}
.checks{display:flex;flex-direction:column;gap:4px;font-size:13px}
.checks .x{color:var(--bad);font-weight:600} .checks .v{color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:10px 16px;font:600 14px var(--f-body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ok);color:var(--surface)}
.btn.primary[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.toast{font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:8px}
.toast.ok{background:var(--ok-bg);color:var(--ok)} .toast.bad{background:var(--bad-bg);color:var(--bad)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist details{background:var(--sunk);border-radius:8px;padding:6px 10px;font-size:13.5px}
.hist summary{cursor:pointer}
.hist pre{white-space:pre-wrap;font:inherit;margin:6px 0 2px;overflow-wrap:anywhere}
/* panel view */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font:700 28px/1.15 var(--f-display);margin-top:4px}
.tile .h{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.bad .v{color:var(--bad)} .tile.ok .v{color:var(--ok)} .tile.warn .v{color:var(--warn)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px}
.stack{display:flex;flex-direction:column;gap:16px}
.att{display:flex;flex-direction:column;gap:6px}
.att div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-block:6px;font-size:14px}
/* roster view */
.forms{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:820px){.forms{grid-template-columns:1fr}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid .full{grid-column:1/-1}
.del{border:0;background:none;color:var(--bad);font:600 13px var(--f-body);cursor:pointer;padding:4px}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .25s ease}@keyframes fade{from{opacity:.3}to{opacity:1}}}
</style>

<header><div class="wrap hrow">
  <div class="brand"><b>Обратная связь AFS</b><span>Astana Future School · учёт обратной связи родителям</span></div>
  <div class="who"><span id="me">Не авторизован</span><button id="logout" class="btn ghost" type="button" hidden>Выйти</button></div>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" id="tab-send" data-tab="send" aria-selected="true">Отправить</button>
    <button role="tab" id="tab-panel" data-tab="panel" aria-selected="false">Панель</button>
    <button role="tab" id="tab-roster" data-tab="roster" aria-selected="false">Ученики</button>
    <button role="tab" id="tab-parent" data-tab="parent" aria-selected="false" hidden>Мои дети</button>
    <button role="tab" id="tab-manage" data-tab="manage" aria-selected="false" hidden>Управление</button>
  </nav>
</div></header>

<div id="login-screen" class="wrap" style="max-width:520px;margin-top:42px"><div class="panel" style="padding:26px"><h2>Вход в AFS Feedback</h2><p class="note">Войдите с учётной записью AFS Feedback.</p><form id="login-form" class="compose"><label>Электронная почта<input id="login-email" type="email" autocomplete="username" required></label><label>Пароль<input id="login-password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Войти</button><div id="login-error" role="alert" class="note"></div></form></div></div>
<main class="wrap" id="app-main" hidden>
  <section id="v-send" class="send">
    <div class="panel">
      <h2>Ученики класса</h2>
      <div class="classbar" id="classbar"></div>
      <div class="slist" id="slist"><div class="empty">Загружаем список учеников…</div></div>
    </div>
    <div class="panel" id="composer"><div class="empty">Выберите ученика слева — откроется форма сообщения по методу «бургер».</div></div>
  </section>
  <section id="v-panel" hidden></section>
  <section id="v-roster" hidden></section>
  <section id="v-manage" hidden></section>
  <section id="v-parent" hidden></section>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://wvkcafxruzguifybeeab.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LoLzxEVI2-ZatrQ8AVW1Fg_mtPVwcj-';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KINDS={point:'Точечная',weekly:'Еженедельная',monthly:'Ежемесячная',absence:'Отсутствие обучающегося'};
let state={user:null, profile:null, roles:[],classes:[],students:[],subjects:[],assignments:[],feedback:[],selectedClass:null,selectedStudent:null, tab:'send',busy:false};
const msg = (e)=>e?.message||'Неизвестная ошибка';
function setLogin(isIn){ $('#login-screen').hidden=isIn;$('#app-main').hidden=!isIn;$('#logout').hidden=!isIn;document.querySelectorAll('.tabs button').forEach(b=>b.disabled=!isIn); }
async function loadData(){
  const queries=[supabase.from('profiles').select('id,full_name,email').eq('id',state.user.id).maybeSingle(),supabase.from('user_roles').select('role').eq('user_id',state.user.id),supabase.from('classes').select('id,name,grade').order('name'),supabase.from('students').select('id,class_id,full_name,status').eq('status','active').order('full_name'),supabase.from('subjects').select('id,name').eq('is_active',true).order('name'),supabase.from('teacher_assignments').select('class_id,subject_id,assignment_type,user_id').eq('user_id',state.user.id),supabase.from('feedback').select('id,student_id,subject_id,author_id,kind,praise,recommendations,support,created_at,published_at,status').order('created_at',{ascending:false}).limit(1000)];
  const results=await Promise.all(queries);
  const labels=['Профиль','Роли','Классы','Ученики','Предметы','Назначения','Отзывы'];
  const errors=results.map((r,i)=>r.error?labels[i]+': '+msg(r.error):null).filter(Boolean);
  if(errors.length) throw Error(errors.join(' | '));
  state.profile=results[0].data;state.roles=results[1].data.map(x=>x.role);state.classes=results[2].data;state.students=results[3].data;state.subjects=results[4].data;state.assignments=results[5].data;state.feedback=results[6].data;
  if(!state.classes.some(c=>c.id===state.selectedClass))state.selectedClass=state.classes[0]?.id??null;
  $('#me').textContent=state.profile?.full_name||state.user.email;
  const isAdmin=state.roles.includes('superadmin')||state.roles.includes('deputy');
  $('#tab-parent').hidden=!state.roles.includes('parent');
  if(state.roles.includes('parent')&&!isAdmin){state.tab='parent';}
  $('#tab-manage').hidden=!isAdmin;
  for(const section of ['send','panel','roster'])$('#tab-'+section).hidden=state.roles.includes('parent')&&!isAdmin;
  if(!isAdmin && state.tab==='manage')state.tab='send';
  for(const section of ['send','panel','roster','manage','parent']){
    $('#v-'+section).hidden=section!==state.tab;
    $('#tab-'+section).setAttribute('aria-selected',String(section===state.tab));
  }
  render();
}
async function enter(session){
  if(!session){state.user=null;state.roles=[];state.tab='send';$('#tab-parent').hidden=true;$('#tab-manage').hidden=true;setLogin(false);$('#me').textContent='Не авторизован';return;}
  state.user=session.user; setLogin(true);
  try{await loadData()}catch(e){$('#classbar').innerHTML='';$('#slist').innerHTML=`<div class="empty">${esc(msg(e))}</div>`;$('#composer').innerHTML='<div class="empty">Не удалось загрузить данные. Проверьте RLS и обновите страницу.</div>';}
}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='Выполняется вход…';const {data,error}=await supabase.auth.signInWithPassword({email:$('#login-email').value.trim(),password:$('#login-password').value});if(error){$('#login-error').textContent=msg(error);return;}$('#login-error').textContent='';await enter(data.session);});
$('#logout').addEventListener('click',async()=>{await supabase.auth.signOut();await enter(null)});
function classStudents(){return state.students.filter(s=>s.class_id===state.selectedClass)}
function pickTab(tab){if(tab==='manage'&&!state.roles.some(r=>r==='superadmin'||r==='deputy'))return;if(tab==='parent'&&!state.roles.includes('parent'))return;state.tab=tab;for(const x of ['send','panel','roster','manage','parent']){$('#v-'+x).hidden=x!==tab;$('#tab-'+x).setAttribute('aria-selected',String(x===tab));}render();}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>pickTab(b.dataset.tab)));
function render(){if(state.tab==='send'){renderList();renderComposer()}else if(state.tab==='panel'){renderPanel()}else if(state.tab==='roster'){renderRoster()}else if(state.tab==='parent'){renderParent()}else{renderManage()}}
function renderList(){
  $('#classbar').innerHTML=state.classes.map(c=>`<button type="button" class="chipbtn" data-class="${c.id}" aria-pressed="${c.id===state.selectedClass}">${esc(c.name)}</button>`).join('');
  $('#slist').innerHTML=classStudents().map(s=>{let last=state.feedback.find(f=>f.student_id===s.id&&f.status==='published');return `<button type="button" class="srow" data-student="${s.id}" aria-current="${s.id===state.selectedStudent}"><span class="n">${esc(s.full_name)}</span><span class="pill ${last?'ok':'bad'}">${last?'Есть отзыв':'Нет отзыва'}</span></button>`}).join('')||'<div class="empty">В этом классе пока нет учеников.</div>';
  document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{state.selectedClass=Number(b.dataset.class);state.selectedStudent=null;render()});
  document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{state.selectedStudent=Number(b.dataset.student);render()});
}
function ownSubjects(){return state.assignments.filter(a=>a.class_id===state.selectedClass&&a.assignment_type==='subject_teacher').map(a=>state.subjects.find(s=>s.id===a.subject_id)).filter(Boolean)}
function renderComposer(){
  const s=state.students.find(x=>x.id===state.selectedStudent);
  if(!s){$('#composer').innerHTML='<div class="empty">Выберите ученика слева — откроется форма сообщения по методу «бургер».</div>';return;}
  const allowed=ownSubjects();
  const history=state.feedback.filter(f=>f.student_id===s.id);
  $('#composer').innerHTML=`<div class="compose"><div class="chead"><div><div class="t">${esc(s.full_name)}</div><div class="s">${esc(state.classes.find(c=>c.id===s.class_id)?.name||'')}</div></div></div>
  <div class="grid2"><label>Вид обратной связи<select id="f-kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Предмет<select id="f-subject">${allowed.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>
  <div class="layer bun top"><span class="lt">1 · Похвала — что освоено</span><textarea id="f-praise" placeholder="Что ребёнку удалось"></textarea></div>
  <div class="layer fill"><span class="lt">2 · Рекомендации — что повторить</span><textarea id="f-recs" placeholder="Что нужно улучшить"></textarea></div>
  <div class="layer bun bot"><span class="lt">3 · Поддержка</span><textarea id="f-support" placeholder="Поддержка и следующий шаг"></textarea></div>
  <div id="extra-point" hidden><label>Тема точечной обратной связи<input id="f-topic" placeholder="Тема урока"></label></div>
  <div><h2>Предпросмотр</h2><div id="preview" class="preview"></div></div>
  <div class="actions"><button id="publish" class="btn primary" type="button" ${allowed.length?'':'disabled'}>Опубликовать обратную связь</button></div>
  <div id="notice" role="status" class="note">${allowed.length?'После публикации запись будет доступна в базе. WhatsApp пока не отправляется.':'Нет назначения на предмет этого класса — публикация недоступна.'}</div>
  <h2>История по ученику</h2><div class="hist">${history.map(f=>`<details><summary>${esc(new Date(f.published_at||f.created_at).toLocaleDateString('ru-RU'))} · ${esc(state.subjects.find(x=>x.id===f.subject_id)?.name||'')} · ${esc(KINDS[f.kind]||f.kind)} · ${esc(f.status)}</summary><pre>${esc([f.praise,f.recommendations,f.support].join('\n\n'))}</pre></details>`).join('')||'<span class="note">Записей пока нет.</span>'}</div></div>`;
  const preview=()=>{$('#preview').textContent=[$('#f-praise').value,$('#f-recs').value,$('#f-support').value].filter(Boolean).join('\n\n')||'Текст появится здесь'};
  ['#f-praise','#f-recs','#f-support'].forEach(q=>$(q).addEventListener('input',preview));
  $('#f-kind').addEventListener('change',()=>{$('#extra-point').hidden=$('#f-kind').value!=='point'}); preview();
  $('#publish').addEventListener('click',async()=>{
   if(state.busy)return;const button=$('#publish'); const notice=$('#notice');
   const params={p_student_id:s.id,p_subject_id:Number($('#f-subject').value),p_kind:$('#f-kind').value,p_praise:$('#f-praise').value,p_recommendations:$('#f-recs').value,p_support:$('#f-support').value,p_topic:$('#f-kind').value==='point'?$('#f-topic').value:null,p_error_type:null};
   if([params.p_praise,params.p_recommendations,params.p_support].some(v=>v.trim().length<10)){notice.textContent='Заполни все три поля: минимум 10 символов каждое.';return;}
   state.busy=true;button.disabled=true;notice.textContent='Публикуем…';
   const {data,error}=await supabase.rpc('publish_feedback',params);
   state.busy=false; if(error){button.disabled=false;notice.textContent='Ошибка: '+msg(error);return;}

}

function renderRoster(){
  const admin=state.roles.some(r=>r==='superadmin'||r==='deputy');
  const opts=state.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const rows=state.students.map(st=>`<tr><td>${esc(state.classes.find(c=>c.id===st.class_id)?.name||'')}</td><td>${esc(st.full_name)}</td>${admin?`<td><button type="button" class="btn ghost" data-edit-student="${st.id}">Редактировать</button></td>`:''}</tr>`).join('');
  $('#v-roster').innerHTML=`<div class="panel"><h2>Ученики (${state.students.length})</h2><div class="tw"><table><thead><tr><th>Класс</th><th>ФИО ученика</th>${admin?'<th>Действие</th>':''}</tr></thead><tbody>${rows}</tbody></table></div></div>`+
  (admin?`<div class="forms" style="margin-top:16px"><div class="panel"><h2 id="student-editor-title">Добавить ученика</h2><form id="student-editor" class="compose"><input type="hidden" id="student-edit-id"><label>ФИО ученика<input id="student-name" required minlength="3" maxlength="160" placeholder="ТЕСТОВЫЙ Ученик"></label><label>Класс<select id="student-class" required>${opts}</select></label><div class="actions"><button class="btn primary" type="submit">Сохранить</button><button class="btn ghost" type="button" id="student-clear">Сбросить</button></div><div id="student-result" class="note" role="status"></div></form></div><div class="panel"><h2>Массовая загрузка учеников</h2><p class="note">Выберите класс и файл Excel (.xlsx) или CSV. Поддерживается таблица с заголовком «ФИО» или первый столбец с ФИО. Один файл — один класс; максимум 200 строк за загрузку.</p><form id="students-import" class="compose"><label>Класс<select id="import-class" required>${opts}</select></label><label>Файл Excel / CSV<input id="students-file" type="file" accept=".xlsx,.xls,.csv" required></label><button class="btn ghost" type="button" id="students-preview">Предпросмотр файла</button><div id="import-preview" class="note" role="status"></div><button class="btn primary" type="submit" id="import-submit" disabled>Импортировать учеников</button><div id="import-result" class="note" role="status"></div></form></div></div>`:'');
  if(!admin)return;
  const editor=$('#student-editor');
  $('#student-clear').onclick=()=>{editor.reset();$('#student-edit-id').value='';$('#student-editor-title').textContent='Добавить ученика';$('#student-result').textContent=''};
  document.querySelectorAll('[data-edit-student]').forEach(b=>b.onclick=()=>{
    const st=state.students.find(x=>x.id===Number(b.dataset.editStudent));if(!st)return;
    $('#student-edit-id').value=st.id;$('#student-name').value=st.full_name;$('#student-class').value=st.class_id;
    $('#student-editor-title').textContent='Редактировать ученика';$('#student-result').textContent='';
    editor.scrollIntoView({behavior:'smooth',block:'center'});
  });
  async function execute(action,payload){const {data,error}=await supabase.rpc('afs_manage_students',{p_action:action,p_payload:payload});if(error)throw error;return data;}
  editor.onsubmit=async e=>{e.preventDefault();const out=$('#student-result'),button=editor.querySelector('[type="submit"]');button.disabled=true;out.textContent='Сохраняем…';try{
    const id=$('#student-edit-id').value;const data=await execute(id?'update_student':'add_student',{student_id:id?Number(id):null,full_name:$('#student-name').value.trim(),class_id:Number($('#student-class').value)});
    await reloadStudents();out.className='toast ok';out.textContent=data.message;renderRoster();$('#student-result').textContent=data.message;
  }catch(err){out.className='toast bad';out.textContent=msg(err)}finally{button.disabled=false}};
  let parsed=[];let currentFile=null;
  $('#students-file').onchange=()=>{parsed=[];currentFile=null;$('#import-submit').disabled=true;$('#import-preview').textContent='Нажмите «Предпросмотр файла»'};
  $('#import-class').onchange=()=>{parsed=[];$('#import-submit').disabled=true;$('#import-preview').textContent='Класс изменён, повторите предпросмотр'};
  $('#students-preview').onclick=async()=>{
    const file=$('#students-file').files?.[0],out=$('#import-preview');parsed=[];$('#import-submit').disabled=true;
    if(!file){out.textContent='Сначала выберите файл';return}
    if(file.size>3*1024*1024){out.textContent='Файл превышает 3 МБ';return}
    out.textContent='Читаем файл…';
    try{
      const mod=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
      const workbook=mod.read(await file.arrayBuffer(),{type:'array'});
      const sheet=workbook.Sheets[workbook.SheetNames[0]];
      const grid=mod.utils.sheet_to_json(sheet,{header:1,defval:'',blankrows:false});
      if(!grid.length)throw Error('Файл пустой');
      const header=grid[0].map(v=>String(v).toLowerCase().trim());
      let col=header.findIndex(v=>v==='фио'||v==='ф.и.о.'||v==='фамилия имя отчество'||v==='ученик'||v==='учащийся');
      const hasHeader=col>=0;if(col<0)col=0;
      parsed=grid.slice(hasHeader?1:0).map(row=>String(row[col]??'').replace(/\s+/g,' ').trim()).filter(Boolean);
      if(parsed.length<1||parsed.length>200)throw Error('Нужно от 1 до 200 учеников в одном файле');
      if(parsed.some(name=>name.length<3||name.length>160))throw Error('Проверьте ФИО: допустимо 3–160 символов');
      currentFile=file;
      const duplicates=parsed.length-new Set(parsed.map(n=>n.toLowerCase())).size;
      out.innerHTML=`<b>Готово к загрузке: ${parsed.length} записей.</b> ${duplicates?'Повторы внутри файла: '+duplicates+'.':''}<div class="preview" style="margin-top:8px;max-height:150px;overflow:auto">${parsed.slice(0,12).map(esc).join('<br>')}${parsed.length>12?'<br>…':''}</div>`;
      $('#import-submit').disabled=false;
    }catch(err){out.textContent='Ошибка чтения: '+msg(err)}
  };
  $('#students-import').onsubmit=async e=>{
    e.preventDefault();const out=$('#import-result'),btn=$('#import-submit');if(!parsed.length||!currentFile){out.textContent='Сначала выполните предпросмотр';return}
    btn.disabled=true;out.className='note';out.textContent='Импортируем…';
    try{const class_id=Number($('#import-class').value);const data=await execute('import_students',{students:parsed.map(full_name=>({full_name,class_id}))});
      await reloadStudents();renderRoster();$('#import-result').className='toast ok';$('#import-result').textContent=`Добавлено: ${data.created}. Пропущено повторов: ${data.skipped}.`;
    }catch(err){out.className='toast bad';out.textContent=msg(err);btn.disabled=false}
  };
}
async function reloadStudents(){
  const {data,error}=await supabase.from('students').select('id,class_id,full_name,status').eq('status','active').order('full_name').limit(10000);
  if(error)throw error;state.students=data||[];
}

// School management: server-authorized RPCs; no service keys in this file.
async function refreshManageData(){
  const [{data:staff,error:e1},{data:classes,error:e2},{data:subjects,error:e3},{data:assignments,error:e4}]=await Promise.all([
    supabase.rpc('afs_staff_directory'),
    supabase.from('classes').select('id,name,grade').order('name'),
    supabase.from('subjects').select('id,name').eq('is_active',true).order('name'),
    supabase.from('teacher_assignments').select('id,user_id,class_id,subject_id,assignment_type')
  ]);
  const error=e1||e2||e3||e4;
  if(error)throw error;
  return {staff:staff||[],classes:classes||[],subjects:subjects||[],assignments:assignments||[]};
}

async function renderParent(){
  const root=$('#v-parent');
  root.innerHTML='<div class="panel">Загружаем отзывы ваших детей…</div>';
  if(!state.roles.includes('parent')){root.textContent='Нет доступа';return;}
  const [{data:mine,error:e1},{data:links,error:e2}]=await Promise.all([
    supabase.from('parents').select('id,full_name').eq('user_id',state.user.id),
    supabase.from('student_parents').select('student_id,parent_id')
  ]);
  if(e1||e2){root.innerHTML=`<div class="toast bad">Ошибка доступа: ${esc(msg(e1||e2))}</div>`;return;}
  const parentIds=new Set((mine||[]).map(p=>p.id));
  const childIds=[...new Set((links||[]).filter(l=>parentIds.has(l.parent_id)).map(l=>l.student_id))];
  if(!childIds.length){root.innerHTML='<div class="empty">Пока нет привязанных детей. Обратитесь к администрации школы.</div>';return;}
  // Здесь используются только опубликованные записи, полученные с учётом RLS.
  const children=state.students.filter(s=>childIds.includes(s.id));
  const feedback=state.feedback.filter(f=>childIds.includes(f.student_id)&&f.status==='published');
  root.innerHTML=`<div class="panel"><h2>Мои дети</h2><p class="note">Здесь отображается только опубликованная обратная связь.</p>
    ${children.map(s=>`<div class="panel" style="margin-top:12px"><h2>${esc(s.full_name)}</h2>${feedback.filter(f=>f.student_id===s.id).map(f=>`<details class="panel" style="margin:8px 0"><summary>${esc(new Date(f.published_at||f.created_at).toLocaleDateString('ru-RU'))} · ${esc(state.subjects.find(x=>x.id===f.subject_id)?.name||'Обратная связь')}</summary><div class="layer bun top" style="margin-top:12px"><b>Похвала</b><div>${esc(f.praise)}</div></div><div class="layer fill"><b>Рекомендации</b><div>${esc(f.recommendations)}</div></div><div class="layer bun bot"><b>Поддержка</b><div>${esc(f.support)}</div></div></details>`).join('')||'<p class="note">Опубликованных отзывов пока нет.</p>'}</div>`).join('')}</div>`;
}
